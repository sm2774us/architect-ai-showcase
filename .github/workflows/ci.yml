name: Enterprise CI-CD Pipeline & 100% Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Unit & Integration Testing (100% Coverage Gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: TypeScript Typecheck & Lint
        run: npm run lint

      - name: Execute Vitest Suite with 100% Coverage Verification
        env:
          NODE_ENV: test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-runner-test-key' }}
        run: npx vitest run --coverage

      - name: Upload Coverage Reports (HTML & LCOV)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 14

      - name: Production Application & Server Build Verification
        run: npm run build
